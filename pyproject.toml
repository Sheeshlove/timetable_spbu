[project]
name = "timetable-spbu-bot"
version = "1.0.0"
description = "Телеграм-бот с расписанием MiM ВШМ СПбГУ по когортам и напоминаниями-заметками"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "openpyxl>=3.1"]

[project.scripts]
timetable-spbu-bot = "bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.handlers", "bot.roster", "bot.timetable"]

[tool.setuptools.package-data]
"bot.roster" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
