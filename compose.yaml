services:
  bot:
    build: .
    image: timetable-spbu-bot
    container_name: timetable-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.sqlite3
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
